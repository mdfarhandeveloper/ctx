<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTX Coin - Secret Admin Dashboard</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/wTrxFzVL/profile-logo.png">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #0f0c24 0%, #05020a 100%);
            --card-bg: rgba(30, 27, 75, 0.7);
            --accent-color: #fbbf24;
            --text-color: #ffffff;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 30px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: none; /* শুরুতে ড্যাশবোর্ড হাইড থাকবে */
        }

        /* Login Card Styles */
        .login-container {
            width: 100%;
            max-width: 400px; 
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-container h3 {
            margin-bottom: 20px;
            color: var(--accent-color);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent-color);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-color) 0%, #d97706 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #f43f5e;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        /* Dashboard Table Styles */
        h2 {
            color: #f43f5e;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Header Layout for Search and Export Button */
        .controls-wrapper {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-export {
            background: #22c55e;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn-export:hover {
            background: #16a34a;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .leaderboard-table th {
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
        }

        .rank-badge {
            display: inline-block;
            width: 26px;
            height: 26px;
            line-height: 26px;
            text-align: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            font-weight: bold;
        }

        .btn-delete {
            background: #e11d48;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-back {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container" id="login-box">
        <h3>🔒 Admin Security Check</h3>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Enter credentials to access master console.</p>
        <div class="error-msg" id="login-error">Invalid Password! Try again.</div>
        <input type="password" id="admin-pass" class="input-field" placeholder="Enter Admin Password...">
        <button class="btn-login" onclick="checkAdminLogin()">Access Dashboard</button>
    </div>

    <div class="container" id="dashboard-box">
        <h2>CTX Database Management Panel</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">Live monitoring, search, and delete controls for all game network records.</p>
        
        <div class="card">
            <div class="controls-wrapper">
                <input type="text" id="admin-search" class="search-box" placeholder="🔍 Search by User ID or TON Wallet Address..." oninput="triggerAdminSearch()">
                <button class="btn-export" onclick="exportToCSV()">Export CSV</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>User ID</th>
                            <th>CTX Balance</th>
                            <th>TON Address</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-leaderboard">
                        <tr>
                            <td colspan="5" style="text-align:center; color:#64748b;">Loading user database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKITS8pdaBi1-icFyZ4CgPxsJe60uszio",
            authDomain: "ctx-9c92f.firebaseapp.com",
            databaseURL: "https://ctx-9c92f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ctx-9c92f",
            storageBucket: "ctx-9c92f.firebasestorage.app",
            messagingSenderId: "853150844818",
            appId: "1:853150844818:web:a4e4698526a6a61320a34b",
            measurementId: "G-TEEZQZLPMD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.allUsersData = [];

        // পাসওয়ার্ড চেক করার ফাংশন
        window.checkAdminLogin = function() {
            const inputPass = document.getElementById('admin-pass').value;
            const SECRET_PASSWORD = "admin1234"; // 👈 আপনার সিক্রেট পাসওয়ার্ডটি এখানে দিন

            if(inputPass === SECRET_PASSWORD) {
                // সেশন সেভ করা হচ্ছে যাতে বারবার রিফ্রেশ করলে লগইন না চাবে
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                showDashboard();
            } else {
                const errorDiv = document.getElementById('login-error');
                errorDiv.style.display = 'block';
                document.getElementById('admin-pass').value = '';
            }
        }

        function showDashboard() {
            document.getElementById('login-box').style.display = 'none';
            
            // বডি ফ্লেক্স সেটিংস রিসেট করা ড্যাশবোর্ড ফুল-উইথ করার জন্য
            document.body.style.display = 'block'; 
            document.getElementById('dashboard-box').style.display = 'block';

            // রিয়েলটাইম ডেটা লোড শুরু হবে লগইন সফল হওয়ার পরেই
            loadFirebaseDatabase();
        }

        // পেজ লোড হওয়ার সময় চেক করবে অলরেডি লগইনড কিনা
        window.addEventListener('DOMContentLoaded', () => {
            if(sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                showDashboard();
            }
        });

        function loadFirebaseDatabase() {
            const allUsersRef = ref(db, 'users');
            onValue(allUsersRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('admin-leaderboard').innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">No users found.</td></tr>`;
                    return;
                }

                window.allUsersData = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).sort((a, b) => (b.balance || 0) - (a.balance || 0));

                renderAdminTable(window.allUsersData);
            });
        }

        function renderAdminTable(usersList) {
            const leaderboardBody = document.getElementById('admin-leaderboard');
            leaderboardBody.innerHTML = '';

            if(usersList.length === 0) {
                leaderboardBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b;">No matching results found.</td></tr>`;
                return;
            }

            usersList.forEach((user, index) => {
                const walletTag = user.walletAddress ? `<span style="color:#22c55e; font-size:13px;">${user.walletAddress}</span>` : `<span style="color:#64748b; font-size:13px;">Not Connected</span>`;
                
                const row = `<tr>
                    <td><span class="rank-badge">${index + 1}</span></td>
                    <td><strong>${user.id}</strong></td>
                    <td style="color: var(--accent-color); font-weight: bold;">${(user.balance || 0).toLocaleString()}</td>
                    <td>${walletTag}</td>
                    <td><button class="btn-delete" onclick="deleteUser('${user.id}')">Delete</button></td>
                </tr>`;
                leaderboardBody.innerHTML += row;
            });
        }
        window.renderAdminTable = renderAdminTable;

        function deleteUser(targetUserId) {
            if (confirm(`⚠️ WARNING: Are you sure you want to permanently delete user "${targetUserId}"?`)) {
                const targetRef = ref(db, 'users/' + targetUserId);
                remove(targetRef).then(() => {
                    alert("User successfully dropped!");
                }).catch((error) => {
                    alert("Operation failed: " + error.message);
                });
            }
        }
        window.deleteUser = deleteUser;
    </script>

    <script>
        function triggerAdminSearch() {
            const query = document.getElementById('admin-search').value.toLowerCase();
            if(!window.allUsersData) return;

            const filtered = window.allUsersData.filter(user => {
                const userIdMatch = user.id.toLowerCase().includes(query);
                const walletMatch = user.walletAddress ? user.walletAddress.toLowerCase().includes(query) : false;
                return userIdMatch || walletMatch;
            });

            window.renderAdminTable(filtered);
        }

        // CSV এক্সপোর্ট করার মূল ফাংশন
        function exportToCSV() {
            if (!window.allUsersData || window.allUsersData.length === 0) {
                alert("No data available to export!");
                return;
            }

            // CSV এর জন্য হেডার তৈরি
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Rank,User ID,CTX Balance,TON Wallet Address";

            // ডাটাবেজের ইউজার লুপ করে CSV ফরম্যাটে সাজানো
            window.allUsersData.forEach((user, index) => {
                const rank = index + 1;
                const userId = user.id ? `"${user.id}"` : "";
                const balance = user.balance || 0;
                const wallet = user.walletAddress ? `"${user.walletAddress}"` : "Not Connected";
                
                csvContent += `\n${rank},${userId},${balance},${wallet}`;
            });

            // ব্রাউজারে ফাইল ডাউনলোডের ব্যবস্থা করা
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            
            // বর্তমান তারিখসহ ফাইলের নাম দেওয়া হচ্ছে (যেমন: ctx_users_2026-05-30.csv)
            const today = new Date().toISOString().split('T')[0];
            link.setAttribute("download", `ctx_users_${today}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
